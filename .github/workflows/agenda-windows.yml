name: Verificar ativação da agenda no Windows

on:
  pull_request:
    branches: [main]
    paths:
      - server/**
      - tests/helpers/windows-console.py
      - tests/agenda-*.test.mjs
      - tests/calendar-deployment.test.mjs
      - tests/push-deployment.test.mjs
      - .github/workflows/agenda-windows.yml
  push:
    branches: [main]
    paths:
      - server/**
      - tests/helpers/windows-console.py
      - tests/agenda-*.test.mjs
      - tests/calendar-deployment.test.mjs
      - tests/push-deployment.test.mjs
      - .github/workflows/agenda-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      RETOMAR_WINDOWS_CONSOLE: '1'
      RETOMAR_VERIFY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Preparar Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Preparar console de teste Windows
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar suporte de console para os testes
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: pywinpty==3.1.2'
      - name: Verificar PowerShell 5.1, entrada e implantação simulada
        shell: powershell
        run: node --test tests/agenda-powershell.test.mjs tests/agenda-input.test.mjs tests/calendar-deployment.test.mjs tests/push-deployment.test.mjs
